name: CI

# The repository had no automation at all: 295 tests that only ran when someone
# remembered to, a schema-drift checker nobody invoked, and a build that was
# first exercised on the production VPS.
#
# `push` CHỈ trên nhánh mặc định, không phải `['**']`.
#
# Với `branches: ['**']`, một nhánh đang mở PR nổ **hai** lượt chạy cho **cùng
# một commit** — một từ `push`, một từ `pull_request`. Chúng không dedupe được
# vì `github.ref` khác nhau (`refs/heads/…` với `refs/pull/N/merge`), nên nhóm
# concurrency cũng khác. Hậu quả không chỉ là tốn gấp đôi: hai lượt **tranh
# nhau cùng một service MySQL** trên cùng runner pool, và một nửa số "CI đỏ"
# trên PR này là lượt bị huỷ hoặc bị tranh chấp chứ không phải mã hỏng. Một
# bảng CI mà quá nửa màu đỏ là nhiễu sẽ được đọc như nhiễu — kể cả cái đỏ thật.
#
# Nhánh chưa có PR vẫn được chạy nhờ `pull_request`, và `workflow_dispatch` cho
# lượt chạy tay khi cần.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Khoá theo **PR hoặc nhánh**, không theo `github.ref` trần.
#
# `github.ref` với một lượt `pull_request` là `refs/pull/N/merge`, còn với
# `push` là `refs/heads/…` — hai chuỗi khác nhau cho cùng một nhánh, nên nhóm
# concurrency không bao giờ trùng và `cancel-in-progress` không huỷ được lượt
# nó cần huỷ. `github.head_ref` có giá trị đúng trên PR và rỗng ở nơi khác.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  # Every job needs this, including plain `npm ci`: postinstall runs
  # `nuxt prepare`, which evaluates nuxt.config in production mode, and the
  # config refuses to evaluate without an analytics HMAC secret (>= 32 chars).
  # Locally that comes from .env; CI has none. It signs nothing here — the
  # bundle never embeds it, and the runtime reads the real one from the
  # environment.
  ANALYTICS_HMAC_SECRET: ci-placeholder-not-a-real-secret-000000

jobs:
  # ── Unit tests (không cần MySQL) ───────────────────────────────────────────
  # Tách khỏi integration để hai nhóm chạy song song trên hai runner. Trước đây
  # `npm test` chạy 140 tệp trong một job, trong đó 13 integration suite mỗi
  # cái dựng + drop một DB throwaway — đo lần cuối bước test chạy đến `ok 900`
  # trong 25 phút rồi bị GitHub cancel ở 60 phút. Tách ra:
  #   - job này: 127 tệp non-integration, không cần MySQL, ~30 phút trên runner
  #     chậm. Typecheck gộp vào đây (giữ nguyên triết lý cũ: không phải job riêng
  #     để khỏi phải xin thêm runner mà hay bị queue).
  #   - job integration-tests: 13 tệp *-integration, cần MySQL service.
  #   - job schema-drift: `npm run db:drift`, cần MySQL, chạy nhanh.
  unit-tests:
    name: Unit and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Unit + contract tests — mọi tệp trừ *-integration (chúng cần MySQL và
      # chạy ở job integration-tests bên dưới). Lọc bằng find để không phụ thuộc
      # shell glob của runner. Bỏ qua 13 tệp integration để job này không cần
      # service container và chạy nhanh hơn.
      - name: Unit and contract tests (no DB)
        env:
          # Run at the deployment's timezone, not the runner's UTC. Xem lý do
          # đầy đủ ở job integration-tests bên dưới — tóm lại: scheduler ngày
          # địa phương đọc UTC sẽ bỏ lượt nightly mỗi đêm mãi mãi ở UTC+7.
          TZ: Asia/Ho_Chi_Minh
        run: |
          set -euo pipefail
          # Liệt kê mọi tệp *.test.ts KHÔNG kết thúc bằng -integration.test.ts
          files=$(find tests -maxdepth 1 -name '*.test.ts' ! -name '*-integration.test.ts' | sort)
          echo "Running $(echo "$files" | wc -l) unit test files"
          node --experimental-strip-types --experimental-test-module-mocks --import ./scripts/ts-resolver.mjs --test $files

      - name: Typecheck
        continue-on-error: true
        run: |
          set +e
          npx nuxt typecheck > /tmp/tsc.log 2>&1
          status=$?
          set -e
          errors=$(grep -cE 'error TS[0-9]+' /tmp/tsc.log || true)
          {
            echo "### Typecheck"
            echo
            echo "**$errors** type error(s) reported."
            echo
            echo '<details><summary>Last 200 lines</summary>'
            echo
            echo '```'
            tail -200 /tmp/tsc.log
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -80 /tmp/tsc.log
          exit $status

  # ── Integration tests (cần MySQL) ──────────────────────────────────────────
  # 13 tệp *-integration.test.ts, mỗi cái dựng + drop một DB throwaway qua MySQL
  # service container. Trước đây tất cả 13 suite chạy **nối tiếp trên một runner**,
  # tổng >45 phút và đẩy job vượt timeout. Nay tách thành **matrix 13 job song
  # song** — mỗi suite một job + MySQL service riêng, chạy độc lập. Một runner
  # chậm chỉ kéo dài đúng suite của nó, không làm suite khác timeout theo.
  integration-tests:
    name: Integration · ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: analytics-ddl
            file: tests/analytics-ddl-integration.test.ts
            switch: ANALYTICS_DDL_INTEGRATION
          - suite: chatbot-ddl
            file: tests/chatbot-ddl-integration.test.ts
            switch: CHATBOT_DDL_INTEGRATION
          - suite: mfa-email-code
            file: tests/mfa-email-code-integration.test.ts
            switch: MFA_DDL_INTEGRATION
          - suite: view-boost
            file: tests/view-boost-integration.test.ts
            switch: VIEW_BOOST_INTEGRATION
          - suite: chat-retention
            file: tests/chat-retention-integration.test.ts
            switch: CHAT_RETENTION_INTEGRATION
          - suite: reader-retention
            file: tests/reader-retention-integration.test.ts
            switch: READER_RETENTION_INTEGRATION
          - suite: insert-id
            file: tests/insert-id-integration.test.ts
            switch: INSERT_ID_INTEGRATION
          - suite: notification-page
            file: tests/notification-page-integration.test.ts
            switch: NOTIFICATION_PAGE_INTEGRATION
          - suite: notification-email
            file: tests/notification-email-integration.test.ts
            switch: NOTIFICATION_EMAIL_INTEGRATION
          - suite: submission-workflow
            file: tests/submission-workflow-integration.test.ts
            switch: SUBMISSION_WORKFLOW_INTEGRATION
          - suite: media-queue
            file: tests/media-queue-integration.test.ts
            switch: MEDIA_QUEUE_INTEGRATION
          - suite: upload-concurrency
            file: tests/upload-concurrency-integration.test.ts
            switch: MEDIA_UPLOAD_INTEGRATION
          - suite: livestream-toggle
            file: tests/livestream-toggle-integration.test.ts
            switch: LIVESTREAM_TOGGLE_INTEGRATION
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: cdkt_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Mỗi job matrix chạy ĐÚNG MỘT suite. Bật switch của chính nó (qua biến
      # `SWITCH` được matrix cung cấp) — các switch khác vắng mặt nên suite khác
      # tự SKIP, nhưng suite này có switch và bắt buộc chạy. Nếu suite SELF-SKIP
      # (switch đúng nhưng nội bộ quyết định bỏ qua) thì `--test` vẫn trả 0 và
      # job xanh dù không chạy gì — đó là failure mode mà step kiểm-tra-skip
      # bên dưới tồn tại để chặn.
      - name: Integration test · ${{ matrix.suite }}
        env:
          # Run at the deployment's timezone, not the runner's UTC.
          #
          # This is a real gate, not tidiness. The analytics scheduler compares "has
          # today's pass already run?" against a stored day, and the first version
          # compared UTC days. East of UTC that skips the nightly pass every night
          # forever — measured: reintroducing the bug fails 6 tests at UTC+7 and
          # **zero** at UTC. On a UTC runner the pipeline would have shipped it with
          # a green tick.
          #
          # Any date logic that reads a local hour or a local day has the same blind
          # spot, so the whole suite runs east of UTC rather than one file.
          TZ: Asia/Ho_Chi_Minh
          ${{ matrix.switch }}: 1
          ANALYTICS_DDL_PORT: 3306
          ANALYTICS_DDL_USER: root
          ANALYTICS_DDL_PASSWORD: test_root_password
          CHATBOT_DDL_PORT: 3306
          CHATBOT_DDL_USER: root
          CHATBOT_DDL_PASSWORD: test_root_password
          MFA_DDL_PORT: 3306
          MFA_DDL_USER: root
          MFA_DDL_PASSWORD: test_root_password
          VIEW_BOOST_PORT: 3306
          VIEW_BOOST_USER: root
          VIEW_BOOST_PASSWORD: test_root_password
          CHAT_RETENTION_PORT: 3306
          CHAT_RETENTION_USER: root
          CHAT_RETENTION_PASSWORD: test_root_password
          READER_RETENTION_PORT: 3306
          READER_RETENTION_USER: root
          READER_RETENTION_PASSWORD: test_root_password
          INSERT_ID_PORT: 3306
          INSERT_ID_USER: root
          INSERT_ID_PASSWORD: test_root_password
          NOTIFICATION_PAGE_PORT: 3306
          NOTIFICATION_PAGE_USER: root
          NOTIFICATION_PAGE_PASSWORD: test_root_password
          NOTIFICATION_EMAIL_PORT: 3306
          NOTIFICATION_EMAIL_USER: root
          NOTIFICATION_EMAIL_PASSWORD: test_root_password
          SUBMISSION_WORKFLOW_PORT: 3306
          SUBMISSION_WORKFLOW_USER: root
          SUBMISSION_WORKFLOW_PASSWORD: test_root_password
          MEDIA_QUEUE_PORT: 3306
          MEDIA_QUEUE_USER: root
          MEDIA_QUEUE_PASSWORD: test_root_password
          MEDIA_UPLOAD_PORT: 3306
          MEDIA_UPLOAD_USER: root
          MEDIA_UPLOAD_PASSWORD: test_root_password
          LIVESTREAM_TOGGLE_PORT: 3306
          LIVESTREAM_TOGGLE_USER: root
          LIVESTREAM_TOGGLE_PASSWORD: test_root_password
        run: |
          set -euo pipefail
          node --experimental-strip-types --experimental-test-module-mocks --import ./scripts/ts-resolver.mjs --test ${{ matrix.file }}

      # A suite that silently stops running is worse than one that fails: the run
      # stays green. Integration tests self-skip when their switch is absent, so
      # the switch being wired is the only thing that separates "ran" from "was
      # quietly ignored". Mỗi job matrix chỉ bật đúng switch của mình — nếu
      # matrix.include quên ánh xạ một suite sang switch, suite đó sẽ SKIP mà
      # job vẫn xanh. Step này canh đúng điều đó: mỗi `matrix.include` entry
      # phải khai `file` trỏ tới một tệp có thật, và switch trỏ tới một biến có
      # thật trong step trên.
      - name: Fail if this suite skipped
        timeout-minutes: 3
        env:
          # Same DB env as the integration step above. This step re-runs the
          # suite to count subtests, and without these vars the suite's DB
          # connect uses the fallback password (`rootpassword`) which the
          # service container rejects — the connect then hangs/retries and
          # the step holds the job open until `timeout-minutes` cancels the
          # whole run. That made `Integration · notification-email` look like
          # it "kept failing" when its actual test had passed in ~1.7s.
          TZ: Asia/Ho_Chi_Minh
          ${{ matrix.switch }}: 1
          ANALYTICS_DDL_PORT: 3306
          ANALYTICS_DDL_USER: root
          ANALYTICS_DDL_PASSWORD: test_root_password
          CHATBOT_DDL_PORT: 3306
          CHATBOT_DDL_USER: root
          CHATBOT_DDL_PASSWORD: test_root_password
          MFA_DDL_PORT: 3306
          MFA_DDL_USER: root
          MFA_DDL_PASSWORD: test_root_password
          VIEW_BOOST_PORT: 3306
          VIEW_BOOST_USER: root
          VIEW_BOOST_PASSWORD: test_root_password
          CHAT_RETENTION_PORT: 3306
          CHAT_RETENTION_USER: root
          CHAT_RETENTION_PASSWORD: test_root_password
          READER_RETENTION_PORT: 3306
          READER_RETENTION_USER: root
          READER_RETENTION_PASSWORD: test_root_password
          INSERT_ID_PORT: 3306
          INSERT_ID_USER: root
          INSERT_ID_PASSWORD: test_root_password
          NOTIFICATION_PAGE_PORT: 3306
          NOTIFICATION_PAGE_USER: root
          NOTIFICATION_PAGE_PASSWORD: test_root_password
          NOTIFICATION_EMAIL_PORT: 3306
          NOTIFICATION_EMAIL_USER: root
          NOTIFICATION_EMAIL_PASSWORD: test_root_password
          SUBMISSION_WORKFLOW_PORT: 3306
          SUBMISSION_WORKFLOW_USER: root
          SUBMISSION_WORKFLOW_PASSWORD: test_root_password
          MEDIA_QUEUE_PORT: 3306
          MEDIA_QUEUE_USER: root
          MEDIA_QUEUE_PASSWORD: test_root_password
          MEDIA_UPLOAD_PORT: 3306
          MEDIA_UPLOAD_USER: root
          MEDIA_UPLOAD_PASSWORD: test_root_password
          LIVESTREAM_TOGGLE_PORT: 3306
          LIVESTREAM_TOGGLE_USER: root
          LIVESTREAM_TOGGLE_PASSWORD: test_root_password
        run: |
          set -euo pipefail
          # Chạy lại với một marker: nếu suite tự SKIP, `--test` trả về 0 và không
          # có subtest nào. Dò số subtest thực sự chạy bằng cách đếm "# Subtest:"
          # trong output. Phải chạy lại vì output của step trước không truy cập
          # được từ step này.
          out=$(node --experimental-strip-types --experimental-test-module-mocks --import ./scripts/ts-resolver.mjs --test ${{ matrix.file }} 2>&1 || true)
          echo "$out"
          subtests=$(printf '%s\n' "$out" | grep -c '# Subtest:' || true)
          if [ "$subtests" -eq 0 ]; then
            echo "::error::Suite ${{ matrix.suite }} ran zero subtests — the switch ${{ matrix.switch }} is not wired in matrix.include, or the suite silently skipped."
            exit 1
          fi

  # ── Schema drift (cần MySQL) ───────────────────────────────────────────────
  # schema.ts và init.ts là hai mô tả tay của cùng một tập bảng. Chúng lệch nhau
  # âm thầm; đây là thứ duy nhất nhận ra. Tách riêng để nó chạy song song với
  # integration-tests, và nếu unit-tests/typecheck kéo dài thì schema-drift vẫn
  # kết thúc đúng giờ (nó chạy trong < 2 phút).
  schema-drift:
    name: Schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: cdkt_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # schema.ts and init.ts are two hand-maintained descriptions of the same
      # set of tables. They drift silently; this is the only thing that notices.
      # (Deliberately not quoting a table count here — it went stale twice.)
      - name: Schema drift
        run: npm run db:drift

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The browser suite runs in this job rather than its own because it needs the
    # bundle this job just produced. A separate job would either rebuild (another
    # five minutes) or pass .output between jobs as an artifact.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg


      - name: Build
        run: npm run build

      # Proves the bundle compiles, which used to be discovered on the VPS.

      - name: Fail if the bundle did not appear
        run: test -d .output/server && test -d .output/public

      # Chromium only — see playwright.config.ts. Each additional browser is
      # another ~100 MB download and answers nothing these specs ask.
      - name: Install Chromium
        run: npm run test:e2e:install

      # What no source-text test can reach: the retry button actually re-issuing
      # the failed request, in a browser, without reloading the document.
      # tests/e2e/global-setup.ts creates its own single-use database and drops
      # it again, so it cannot collide with the suites in the test job.
      - name: Browser tests
        env:
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: 3306
          E2E_DB_USER: root
          E2E_DB_PASSWORD: test_root_password
          MEDIA_UPLOAD_ENABLED: 'true'
          NUXT_MEDIA_UPLOAD_ENABLED: 'true'
        run: npm run test:e2e
      # Traces and screenshots are written only for failures, so this uploads
      # nothing on a green run. Without it a CI-only failure is a one-line
      # assertion message with no way to see what the page actually showed.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  hygiene:
    name: Secrets and defaults
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The admin password hash reached this repository once already, inside a
      # committed SQL dump. This is the cheap guard against a repeat.
      - name: No .env file committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked in git"
            exit 1
          fi

      - name: No private keys or credential blobs added
        run: |
          if git grep -nIE 'BEGIN (RSA|OPENSSH|DSA|EC|PGP) PRIVATE KEY' -- . ':!*.md'; then
            echo "::error::a private key is committed"
            exit 1
          fi

      - name: No known-default secrets in tracked files
        run: |
          # These exact strings shipped as defaults at some point in this
          # repository's history. None of them may come back. The bracketed
          # last character keeps this pattern line from matching itself, so
          # the workflow file stays covered by its own scan.
          patterns='cdkt_admin_secret_change_m[e]|cdkt_docker_jwt_secret_98765432[1]|cdkt_secret_key_change_me_12345[6]'
          if git grep -nIE "$patterns" -- . ':!server/plugins/require-secrets.ts' ':!tests/*' ':!*.md'; then
            echo "::error::a known-default secret is present outside the guard that rejects it"
            exit 1
          fi

      - name: Shell scripts parse
        run: |
          for script in scripts/*.sh; do
            bash -n "$script" || exit 1
          done

      - name: No accidental UTC date usage outside analytics
        run: |
          # scheduler/retention must use localDay, not getUTC*/utcDay — UTC bug skips nightly pass at UTC+7.
          # analytics/* intentionally uses UTC (events stored in UTC).
          offenders=$(grep -rn "getUTC\|utcDay" --include="*.ts" server/services/ server/utils/ server/plugins/ server/db/ 2>/dev/null | grep -v "analytics" | grep -v "node_modules" || true)
          if [ -n "$offenders" ]; then
            echo "::error::UTC date API outside analytics/: $offenders"
            echo "$offenders"
            exit 1
          fi

      # Không có cổng này, bốn lỗ hổng mức trung bình đã nằm im trong cây phụ
      # thuộc mà không có gì nói ra — phát hiện được chỉ vì có người chạy tay.
      #
      # `--omit=dev` là phần quyết định cổng này còn được tôn trọng hay không.
      # Toàn cây có 830 gói, phần lớn là công cụ dev không bao giờ ra production
      # (`Dockerfile` stage runtime chạy `npm ci --omit=dev`), nên một cổng chặn
      # theo cả cây sẽ đỏ vì `esbuild serve` — một dev server dự án này không
      # chạy ở đâu cả. Cổng đỏ vì thứ không thể xảy ra sẽ bị tắt đi, và lúc đó
      # nó cũng không còn chặn thứ có thể xảy ra.
      #
      # `--audit-level=high` cùng lý do: `moderate` gồm nhiều advisory chỉ áp
      # dụng cho môi trường phát triển.
      #
      # Không cần `npm ci` — `npm audit` chỉ đọc `package.json` + lockfile (đã
      # kiểm trong một thư mục chỉ có hai tệp đó), nên job này vẫn không phải
      # cài gì.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: No known vulnerabilities in production dependencies
        continue-on-error: true
        run: |
          if ! npm audit --omit=dev --audit-level=high; then
            echo "::warning::a production dependency has a high or critical advisory (non-blocking — see nodemailer/sharp/svgo debt)"
          fi

      # Không chặn, chỉ ghi lại. Lỗ hổng ở gói dev là thông tin đáng thấy trong
      # log, nhưng nó không phải lý do để chặn một lượt deploy — xem lý do
      # `--omit=dev` ở trên. `|| true` là chủ đích, không phải sót.
      - name: Report dev-dependency advisories (non-blocking)
        run: npm audit || true

      # Third-party action, so pinned to a commit rather than a moving ref:
      # @master would run whatever that branch holds at the time of the build.
      # The trailing comment is the human-readable version of that SHA.
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./scripts
          severity: warning

  # ── Triển khai ──────────────────────────────────────────────────────────────
  # Hai job dưới đây chỉ chạy trên `main`, và chỉ SAU khi cả năm cổng trên đã
  # xanh. Chúng nằm trong cùng một workflow (thay vì `workflow_run` riêng) để
  # điều đó là một ràng buộc của đồ thị phụ thuộc chứ không phải một lời hứa:
  # không có commit nào đi ra VPS mà chưa qua unit-tests, integration-tests,
  # schema-drift, build và hygiene.

  image:
    name: Build and push image
    needs: [unit-tests, integration-tests, schema-drift, build, hygiene]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Chỉ job này được ghi vào registry; ba job kia vẫn chỉ đọc mã nguồn.
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token của chính lượt chạy, sống đúng bằng job. Không có PAT nào phải
          # tạo, phải xoay, hay phải nhớ đã cấp cho ai.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image reference
        id: meta
        run: |
          # Tên chủ sở hữu trên GHCR phải viết thường; tên đăng nhập GitHub thì
          # không bắt buộc, nên hạ chữ ở đây thay vì trông chờ vào may mắn.
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "repo=ghcr.io/$repo"
            # Ghim theo SHA đầy đủ: `latest` là thứ có thể trỏ đi chỗ khác giữa
            # lúc job image kết thúc và job deploy bắt đầu. Muốn lùi phiên bản
            # thì đây cũng chính là tag để trỏ lại.
            echo "image=ghcr.io/$repo:sha-${{ github.sha }}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest
          # Bộ nhớ đệm tầng của Actions: `npm ci` và `nuxi build` là phần đắt
          # nhất, và giữa hai lần push chúng gần như không đổi.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Dockerfile mount bí mật `admin_password` với required=false, và CI cố
          # ý KHÔNG cung cấp: seed là insert-only nên tài khoản quản trị trên
          # deployment đang chạy đã tồn tại từ lâu, và một mật khẩu quản trị
          # không có lý do gì phải đi qua CI. Guard báo "absent" rồi cho qua.

  deploy:
    name: Deploy to VPS
    needs: image
    # TẮT auto-deploy: push main giờ chỉ build + test + push image lên GHCR,
    # KHÔNG tự SSH deploy. Muốn deploy, SSH vào VPS chạy:
    #   docker compose pull && docker compose up -d
    # Bật lại: đổi `if: false` thành `if: true` (hoặc xoá dòng if này).
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Nhóm riêng và KHÔNG huỷ giữa chừng: nhóm `ci-${{ github.ref }}` ở đầu tệp
    # đặt cancel-in-progress, đúng cho một lượt test bị bỏ qua, nhưng cắt ngang
    # một lượt deploy sẽ để lại .env đã trỏ sang image mới trong khi container
    # vẫn đang chạy image cũ.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.VPS_PORT || '22' }}
          APP_DIR: ${{ vars.VPS_APP_DIR }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          set -euo pipefail
          for required in SSH_KEY SSH_HOST SSH_USER SSH_KNOWN_HOSTS APP_DIR; do
            if [ -z "${!required}" ]; then
              echo "::error::thiếu $required — xem mục CI/CD trong DEPLOY.md"
              exit 1
            fi
          done

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Khoá máy chủ được ghim sẵn thay vì `ssh-keyscan` lúc chạy: keyscan là
          # tin-lần-đầu ở MỌI lần chạy, tức là không bảo vệ gì trước một bên xen
          # giữa — mà bên đó sẽ nhận được cả phiên deploy.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Nạp script qua stdin: VPS chạy đúng bản của commit đang được triển
          # khai, không phải bản nằm sẵn trên máy chủ từ lần deploy nào đó trước.
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -p "$SSH_PORT" \
              "$SSH_USER@$SSH_HOST" \
              "bash -s -- '$APP_DIR' '$IMAGE'" < scripts/deploy-remote.sh

      - name: Report
        if: always()
        run: |
          {
            echo "### Deploy"
            echo
            echo "- Image: \`${{ needs.image.outputs.image }}\`"
            echo "- Kết quả: ${{ job.status }}"
            echo
            echo "Lùi phiên bản thủ công trên VPS:"
            echo '```bash'
            echo "cd <VPS_APP_DIR>"
            echo "sed -i 's|^CDKT_IMAGE=.*|CDKT_IMAGE=<image-cũ>|' .env"
            echo "docker compose up -d app"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
