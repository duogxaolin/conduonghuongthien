name: CI

# The repository had no automation at all: 295 tests that only ran when someone
# remembered to, a schema-drift checker nobody invoked, and a build that was
# first exercised on the production VPS.
#
# `push` CHỈ trên nhánh mặc định, không phải `['**']`.
#
# Với `branches: ['**']`, một nhánh đang mở PR nổ **hai** lượt chạy cho **cùng
# một commit** — một từ `push`, một từ `pull_request`. Chúng không dedupe được
# vì `github.ref` khác nhau (`refs/heads/…` với `refs/pull/N/merge`), nên nhóm
# concurrency cũng khác. Hậu quả không chỉ là tốn gấp đôi: hai lượt **tranh
# nhau cùng một service MySQL** trên cùng runner pool, và một nửa số "CI đỏ"
# trên PR này là lượt bị huỷ hoặc bị tranh chấp chứ không phải mã hỏng. Một
# bảng CI mà quá nửa màu đỏ là nhiễu sẽ được đọc như nhiễu — kể cả cái đỏ thật.
#
# Nhánh chưa có PR vẫn được chạy nhờ `pull_request`, và `workflow_dispatch` cho
# lượt chạy tay khi cần.
on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review`: PR nháp bị bỏ qua (job `changes` báo run=false), nên phải chạy lại
    # đúng lúc nó được đánh dấu sẵn sàng.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'openspec/**'
  # Lượt chạy tay (Actions → CI → Run workflow trên một nhánh) luôn chạy ĐỦ bộ, kể cả
  # integration — cách ép full CI cho một PR mà không cần đẩy commit.
  workflow_dispatch:

# Khoá theo **PR hoặc nhánh**, không theo `github.ref` trần.
#
# `github.ref` với một lượt `pull_request` là `refs/pull/N/merge`, còn với
# `push` là `refs/heads/…` — hai chuỗi khác nhau cho cùng một nhánh, nên nhóm
# concurrency không bao giờ trùng và `cancel-in-progress` không huỷ được lượt
# nó cần huỷ. `github.head_ref` có giá trị đúng trên PR và rỗng ở nơi khác.
#
# `cancel-in-progress` CHỈ đúng cho pull request. Huỷ ở cấp workflow là huỷ CẢ
# lượt chạy — kể cả job `deploy` đang chạy bên trong nó; nhóm `deploy-production`
# riêng của job đó không che được, vì nhóm ấy chỉ xếp hàng các job deploy với
# nhau. Với `true` trơn, một push thứ hai vào `main` trong lúc deploy đang chờ
# healthcheck sẽ cắt phiên SSH giữa chừng: đường lùi phiên bản không bao giờ
# chạy, production nằm lại trên một image chưa được xác nhận.
#
# Nên: PR vẫn huỷ lượt cũ của chính nó (commit mới thay commit cũ, không ai cần
# kết quả cũ); `main` và chạy tay thì XẾP HÀNG — GitHub giữ một lượt đang chờ và
# chỉ huỷ những lượt còn ĐANG CHỜ cũ hơn, không bao giờ cắt lượt đang chạy.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Node 22 has a test-runner IPC bug under `--experimental-test-module-mocks`:
  # `Unable to deserialize cloned data due to invalid or unsupported version` at
  # `processRawBuffer` (node:internal/test_runner/runner). It crashes integration
  # suites whose import graph touches native modules (media-queue,
  # upload-concurrency) even when those suites use no mocks themselves — the
  # flag clones the whole module graph for every test file. Reproduced locally
  # in node:22-slim (v22.23.3) and gone in node:24-slim + node:26. `engines`
  # already permits ^24.11.0, so CI runs on 24 LTS.
  NODE_VERSION: '24'
  # Every job needs this, including plain `npm ci`: postinstall runs
  # `nuxt prepare`, which evaluates nuxt.config in production mode, and the
  # config refuses to evaluate without an analytics HMAC secret (>= 32 chars).
  # Locally that comes from .env; CI has none. It signs nothing here — the
  # bundle never embeds it, and the runtime reads the real one from the
  # environment.
  ANALYTICS_HMAC_SECRET: ci-placeholder-not-a-real-secret-000000

jobs:
  # ── Lập kế hoạch: PR chỉ chạy bộ nhẹ ──────────────────────────────────────
  # Mỗi lượt CI đầy đủ tốn ~40 phút billed (GitHub làm tròn từng job lên phút), trong
  # đó các job Integration chiếm ~29 (đo khi matrix còn 13 job; nay 18). Tài khoản chỉ có 3.000 phút/tháng và đã hết một
  # lần, nên:
  #   - PR nháp: bỏ qua hoàn toàn (chạy lại khi bấm "Ready for review").
  #   - PR thường: unit + build + schema-drift + hygiene (~12 phút). Integration chỉ chạy
  #     khi PR đụng tới backend/DB/CI (`server/`, `migrations/`, `scripts/`, package*.json,
  #     nuxt.config.ts, workflows, tests/*integration*).
  #   - push vào `main` và chạy tay: LUÔN chạy đủ. `image`/`deploy` vẫn chờ mọi cổng, nên
  #     không có commit nào ra VPS mà chưa qua integration.
  # Với PR, job này không checkout — chỉ hỏi API danh sách tệp đổi của PR (~1 phút billed).
  #
  # Output `deploy` (chỉ có ý nghĩa với push): mọi merge vào `main` đều deploy, kể cả
  # merge chỉ sửa tài liệu/kế hoạch — build lại image và khởi động lại container
  # production vì một dấu phẩy trong tệp .md. Push mà MỌI tệp đổi TỪ COMMIT ĐANG CHẠY
  # TRÊN PRODUCTION khớp `\.md$|^docs/|^openspec/` thì `deploy=false`: test vẫn chạy đủ
  # (năm test đọc tệp .md — vì vậy KHÔNG dùng `push: paths-ignore`), chỉ `image`/`deploy`
  # bỏ qua. Mốc so là bản đang chạy, KHÔNG phải `github.event.before` — xem bước
  # "Docs-only?" bên dưới. Không biết chắc → `deploy=true`. tests/ci-docs-only-skip.test.ts
  # chạy thật script của bước đó trong một repo git tạm (curl/gh giả).
  changes:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      # Bước "Docs-only?" đọc danh sách lượt chạy + job của chính workflow này (mốc (b)).
      actions: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      integration: ${{ steps.plan.outputs.integration }}
      deploy: ${{ steps.deploy.outputs.deploy }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "integration=true" >> "$GITHUB_OUTPUT"
            echo "Không phải PR ($EVENT): chạy đủ bộ." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$DRAFT" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "integration=false" >> "$GITHUB_OUTPUT"
            echo "PR nháp: bỏ qua CI (chạy lại khi Ready for review)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -Eq '^(server/|migrations/|scripts/|package(-lock)?\.json$|nuxt\.config\.ts$|\.github/workflows/|tests/[^/]*integration)'; then
            echo "integration=true" >> "$GITHUB_OUTPUT"
            echo "PR đụng backend/DB/CI: chạy cả integration." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "integration=false" >> "$GITHUB_OUTPUT"
            echo "PR không đụng backend/DB/CI: bỏ integration (Actions → CI → Run workflow để ép chạy đủ)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Lịch sử ĐẦY ĐỦ: mốc so là commit đang chạy trên production, có thể cách HEAD
      # nhiều commit (và phải tra được 12 ký tự SHA của nó). `blob:none`: chỉ commit +
      # cây (repo có ~700 MB lịch sử blob) — `git diff --name-only`, `rev-parse`,
      # `merge-base` không cần nội dung tệp.
      - name: Checkout (push — history back to the live commit)
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      # Mốc so = commit ĐANG CHẠY trên production, không phải `github.event.before`.
      # `before` là đỉnh cũ của `main`, không phải thứ production chạy: lượt A đang
      # deploy, push mã B đang chờ, push chỉ-tài-liệu C tới → GitHub huỷ B (nhóm
      # concurrency chỉ giữ MỘT lượt chờ), C so B..C = chỉ tài liệu → không deploy, và mã
      # của B không bao giờ lên production dù CI xanh. Cùng chuyện khi B đỏ một cổng
      # chập chờn trước `image` rồi C chỉ đổi tài liệu.
      #
      # Mốc, theo thứ tự:
      #   (a) `vars.VPS_SMOKE_URL` có đặt: `version` mà /api/public/health trả qua địa chỉ
      #       công khai (12 ký tự SHA nướng vào image — job `image`), tra ra commit;
      #   (b) không có/không dùng được: `head_sha` của lượt chạy MỚI NHẤT (theo lúc bắt
      #       đầu chạy — lượt chạy lại tính theo lần chạy lại) trên `main` mà job
      #       "Deploy to VPS" kết luận `success` (một lượt chỉ-tài-liệu cũng `success`
      #       nhưng job deploy `skipped`, nên phải xét JOB, không xét lượt chạy);
      #   (c) không có mốc, hoặc mốc không phải tổ tiên của commit này → deploy.
      # Lượt này chỉ bắt đầu khi lượt trước trong nhóm `ci-…` đã xong hẳn (push vào
      # `main` xếp hàng), nên kết quả deploy trước đó đã ngã ngũ lúc bước này chạy.
      #
      # Mốc == commit này: production đã chạy đúng nó → `deploy=false` (không có gì mới).
      # Ép deploy lại cùng commit: Actions → CI → Run workflow trên `main` (luôn deploy).
      # Mốc khác commit này nhưng diff rỗng (cây y hệt) → vẫn deploy, cho chắc.
      #
      # `--no-renames`: một tệp .ts đổi tên thành .md phải liệt kê CẢ HAI đường dẫn
      # (bên xoá là mã), nếu không lượt đó bị coi là "chỉ tài liệu". `grep -Ev` không
      # `-q`: đọc hết đầu vào, nên printf không bao giờ chết vì SIGPIPE dưới pipefail.
      # Chuỗi `version` từ mạng chỉ được dùng khi đúng 12 ký tự hex (không bao giờ tới
      # git như một tuỳ chọn).
      - name: Docs-only? (decides image + deploy for a push)
        id: deploy
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          SMOKE_URL: ${{ vars.VPS_SMOKE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `name:` của job deploy bên dưới (tests/ci-docs-only-skip.test.ts ghim hai chỗ khớp nhau).
          deploy_job='Deploy to VPS'

          # (a) Commit mà địa chỉ công khai đang phục vụ.
          live_commit() {
            local body version
            [ -n "$SMOKE_URL" ] || return 1
            body=$(curl -fsSL -m 10 --retry 2 --retry-delay 3 "${SMOKE_URL%/}/api/public/health?t=${RUN_ID}-plan" 2>/dev/null) || return 1
            version=$(printf '%s' "$body" | jq -r '.version // empty' 2>/dev/null) || return 1
            [[ "$version" =~ ^[0-9a-f]{12}$ ]] || return 1
            git rev-parse --verify --quiet "${version}^{commit}"
          }

          # (b) head_sha của lượt chạy mới nhất trên main có job deploy `success`.
          last_deployed_commit() {
            local workflow runs id sha
            workflow=${WORKFLOW_REF%@*}
            workflow=${workflow##*/}
            [ -n "$workflow" ] || return 1
            runs=$(gh api "repos/$REPO/actions/workflows/$workflow/runs?branch=main&status=completed&per_page=30" 2>/dev/null) || return 1
            while read -r id sha; do
              [[ "$id" =~ ^[0-9]+$ ]] || continue
              if gh api "repos/$REPO/actions/runs/$id/jobs?filter=latest&per_page=100" 2>/dev/null \
                  | jq -e --arg name "$deploy_job" 'any(.jobs[]; .name == $name and .conclusion == "success")' >/dev/null 2>&1; then
                [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || return 1
                git rev-parse --verify --quiet "${sha}^{commit}"
                return
              fi
            done < <(printf '%s' "$runs" | jq -r '.workflow_runs | sort_by(.run_started_at) | reverse | .[] | "\(.id) \(.head_sha)"' 2>/dev/null)
            return 1
          }

          deploy=true
          case "$EVENT" in
            pull_request)
              deploy=false
              reason="pull request — không bao giờ deploy" ;;
            push)
              if base=$(live_commit); then
                source="bản đang chạy trên VPS_SMOKE_URL (/api/public/health)"
              elif base=$(last_deployed_commit); then
                source="lượt chạy gần nhất có job \"$deploy_job\" thành công"
              else
                base=''
              fi
              if [ -z "$base" ]; then
                reason="không xác định được commit đang chạy trên production (VPS_SMOKE_URL trống hoặc không trả version dùng được, và không tìm thấy lượt chạy có job \"$deploy_job\" thành công) — deploy"
              elif [ "$base" = "$SHA" ]; then
                deploy=false
                reason="$SHA đã là bản đang chạy ($source) — không có gì mới để deploy; ép deploy lại: Actions → CI → Run workflow trên main"
              elif ! git merge-base --is-ancestor "$base" "$SHA" 2>/dev/null; then
                reason="bản đang chạy $base ($source) không phải tổ tiên của $SHA — deploy"
              elif ! files=$(git diff --no-renames --name-only "$base" "$SHA" 2>/dev/null); then
                reason="không so được $base..$SHA — deploy"
              elif [ -z "$files" ]; then
                reason="$base..$SHA không đổi tệp nào nhưng là commit khác bản đang chạy ($source) — deploy cho chắc"
              else
                code=$(printf '%s\n' "$files" | grep -Ev '\.md$|^docs/|^openspec/' || true)
                if [ -z "$code" ]; then
                  deploy=false
                  reason="từ bản đang chạy $base ($source) tới $SHA chỉ đổi tài liệu (*.md, docs/, openspec/) — bỏ build image và deploy, test vẫn chạy"
                else
                  reason="từ bản đang chạy $base ($source) tới $SHA có tệp ngoài tài liệu đổi — deploy"
                fi
              fi ;;
            *)
              reason="$EVENT — luôn deploy (cách ép deploy lại cùng một commit)" ;;
          esac
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Deploy: **$deploy** — $reason." >> "$GITHUB_STEP_SUMMARY"

  # ── Unit tests (không cần MySQL) ───────────────────────────────────────────
  # Tách khỏi integration để hai nhóm chạy song song trên hai runner. Trước đây
  # `npm test` chạy 140 tệp trong một job, trong đó 13 integration suite mỗi
  # cái dựng + drop một DB throwaway — đo lần cuối bước test chạy đến `ok 900`
  # trong 25 phút rồi bị GitHub cancel ở 60 phút. Tách ra:
  #   - job này: 203 tệp non-integration, không cần MySQL, ~30 phút trên runner
  #     chậm. Typecheck gộp vào đây (giữ nguyên triết lý cũ: không phải job riêng
  #     để khỏi phải xin thêm runner mà hay bị queue).
  #   - job integration-tests: 18 tệp *-integration, cần MySQL service.
  #   - job schema-drift: `npm run db:drift`, cần MySQL, chạy nhanh.
  unit-tests:
    name: Unit and typecheck
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      # FFmpeg qua apt — có trần thời gian, và đổi sang mirror chính của Ubuntu khi mirror
      # mặc định chậm/hỏng. Từ 2026-10-23 mirror azure.archive.ubuntu.com cấu hình sẵn trên
      # runner làm bước này mất tới 20 phút (trước đó 20–60 giây) và cắt job vì quá timeout
      # dù build/test đều xanh. Runner ubuntu-24.04 khai `URIs: mirror+file:/etc/apt/apt-mirrors.txt`
      # nên tên mirror nằm trong apt-mirrors.txt — sửa sources.list mà thôi thì không đổi gì.
      # Chỉ bước TẢI có trần thời gian; giải nén/cài từ gói đã tải chạy sau, không bị cắt giữa
      # chừng (dpkg bị giết giữa chừng làm mọi lần thử sau hỏng ngay). `--no-install-recommends`:
      # libx264, aac, lavfi, ffprobe đều là phụ thuộc bắt buộc của gói ffmpeg.
      - name: Install FFmpeg
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for mirror in default archive.ubuntu.com; do
            if [ "$mirror" != default ]; then
              echo "::warning::mirror apt mặc định chậm hoặc hỏng — chuyển sang archive.ubuntu.com"
              sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
              cat /etc/apt/apt-mirrors.txt 2>/dev/null || true
            fi
            if timeout -k 10 90 sudo -E apt-get $APT_OPTS update -qq \
              && timeout -k 10 180 sudo -E apt-get $APT_OPTS install -y -qq --download-only --no-install-recommends ffmpeg; then
              sudo -E apt-get install -y -qq --no-install-recommends ffmpeg
              ffmpeg -hide_banner -version | head -1
              exit 0
            fi
          done
          exit 1

      # Unit + contract tests — mọi tệp trừ *-integration (chúng cần MySQL và
      # chạy ở job integration-tests bên dưới). Lọc bằng find để không phụ thuộc
      # shell glob của runner. Bỏ qua 18 tệp integration để job này không cần
      # service container và chạy nhanh hơn.
      - name: Unit and contract tests (no DB)
        env:
          # Run at the deployment's timezone, not the runner's UTC. Xem lý do
          # đầy đủ ở job integration-tests bên dưới — tóm lại: scheduler ngày
          # địa phương đọc UTC sẽ bỏ lượt nightly mỗi đêm mãi mãi ở UTC+7.
          TZ: Asia/Ho_Chi_Minh
        run: |
          set -euo pipefail
          # Liệt kê mọi tệp *.test.ts KHÔNG kết thúc bằng -integration.test.ts
          files=$(find tests -maxdepth 1 -name '*.test.ts' ! -name '*-integration.test.ts' | sort)
          echo "Running $(echo "$files" | wc -l) unit test files"
          # `--experimental-test-coverage` adds ~5% to the run and prints the table at
          # the end of the log; `tee` keeps it for the summary step below. `pipefail`
          # (set above) keeps a failing test failing the step.
          node --experimental-strip-types --experimental-test-module-mocks --experimental-test-coverage --import ./scripts/ts-resolver.mjs --test $files | tee /tmp/unit-test.log

      # Báo cáo độ phủ — CHỈ báo cáo, không chặn: chưa có ngưỡng nào, vì một con số chọn
      # trước khi ai đó thấy mức nền chỉ là cách mới để CI đỏ. `continue-on-error` ở đây
      # đúng chỗ (bước này không phải cổng); cổng Typecheck bên dưới thì không có.
      - name: Coverage summary
        if: always()
        continue-on-error: true
        run: node --experimental-strip-types scripts/coverage-summary.ts < /tmp/unit-test.log >> "$GITHUB_STEP_SUMMARY"

      # Cổng CHẶN: `exit $status` ở cuối + không có `continue-on-error`. Trước đây
      # bước này có `continue-on-error: true`, nên 4 lỗi kiểu lọt vào `main` mà CI
      # vẫn xanh (tests/ops-scripts.test.ts canh cả hai điều kiện).
      - name: Typecheck
        run: |
          set +e
          npx nuxt typecheck > /tmp/tsc.log 2>&1
          status=$?
          set -e
          errors=$(grep -cE 'error TS[0-9]+' /tmp/tsc.log || true)
          {
            echo "### Typecheck"
            echo
            echo "**$errors** type error(s) reported."
            echo
            echo '<details><summary>Last 200 lines</summary>'
            echo
            echo '```'
            tail -200 /tmp/tsc.log
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -80 /tmp/tsc.log
          exit $status

  # ── Integration tests (cần MySQL) ──────────────────────────────────────────
  # 18 tệp *-integration.test.ts, mỗi cái dựng + drop một DB throwaway qua MySQL
  # service container. Trước đây tất cả suite (khi đó 13) chạy **nối tiếp trên một runner**,
  # tổng >45 phút và đẩy job vượt timeout. Nay tách thành **matrix 18 job song
  # song** — mỗi suite một job + MySQL service riêng, chạy độc lập. Một runner
  # chậm chỉ kéo dài đúng suite của nó, không làm suite khác timeout theo.
  integration-tests:
    name: Integration · ${{ matrix.suite }}
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.integration == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: analytics-ddl
            file: tests/analytics-ddl-integration.test.ts
            switch: ANALYTICS_DDL_INTEGRATION
          - suite: chatbot-ddl
            file: tests/chatbot-ddl-integration.test.ts
            switch: CHATBOT_DDL_INTEGRATION
          - suite: mfa-email-code
            file: tests/mfa-email-code-integration.test.ts
            switch: MFA_DDL_INTEGRATION
          - suite: view-boost
            file: tests/view-boost-integration.test.ts
            switch: VIEW_BOOST_INTEGRATION
          - suite: chat-retention
            file: tests/chat-retention-integration.test.ts
            switch: CHAT_RETENTION_INTEGRATION
          - suite: reader-retention
            file: tests/reader-retention-integration.test.ts
            switch: READER_RETENTION_INTEGRATION
          - suite: insert-id
            file: tests/insert-id-integration.test.ts
            switch: INSERT_ID_INTEGRATION
          - suite: notification-page
            file: tests/notification-page-integration.test.ts
            switch: NOTIFICATION_PAGE_INTEGRATION
          - suite: notification-email
            file: tests/notification-email-integration.test.ts
            switch: NOTIFICATION_EMAIL_INTEGRATION
          - suite: submission-workflow
            file: tests/submission-workflow-integration.test.ts
            switch: SUBMISSION_WORKFLOW_INTEGRATION
          - suite: media-queue
            file: tests/media-queue-integration.test.ts
            switch: MEDIA_QUEUE_INTEGRATION
          - suite: media-self-heal
            file: tests/media-self-heal-integration.test.ts
            switch: MEDIA_SELF_HEAL_INTEGRATION
          - suite: upload-concurrency
            file: tests/upload-concurrency-integration.test.ts
            switch: MEDIA_UPLOAD_INTEGRATION
          - suite: livestream-toggle
            file: tests/livestream-toggle-integration.test.ts
            switch: LIVESTREAM_TOGGLE_INTEGRATION
          - suite: backup-dump
            file: tests/backup-dump-integration.test.ts
            switch: BACKUP_DUMP_INTEGRATION
          - suite: media-sync-rewrite
            file: tests/media-sync-rewrite-integration.test.ts
            switch: MEDIA_SYNC_INTEGRATION
          - suite: public-read
            file: tests/public-read-integration.test.ts
            switch: PUBLIC_READ_INTEGRATION
          - suite: media-category-migration
            file: tests/media-category-migration-integration.test.ts
            switch: MEDIA_CATEGORY_MIGRATION_INTEGRATION
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: cdkt_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      # Không suite integration nào gọi FFmpeg thật (media-queue dùng runner giả) —
      # 18 job không còn cài nó, nên mirror apt chập chờn không cắt được chúng nữa.

      # Mỗi job matrix chạy ĐÚNG MỘT suite. Bật switch của chính nó (qua biến
      # `SWITCH` được matrix cung cấp) — các switch khác vắng mặt nên suite khác
      # tự SKIP, nhưng suite này có switch và bắt buộc chạy. Nếu suite SELF-SKIP
      # (switch đúng nhưng nội bộ quyết định bỏ qua) thì `--test` vẫn trả 0 và
      # job xanh dù không chạy gì — đó là failure mode mà step kiểm-tra-skip
      # bên dưới tồn tại để chặn.
      - name: Integration test · ${{ matrix.suite }}
        env:
          # Run at the deployment's timezone, not the runner's UTC.
          #
          # This is a real gate, not tidiness. The analytics scheduler compares "has
          # today's pass already run?" against a stored day, and the first version
          # compared UTC days. East of UTC that skips the nightly pass every night
          # forever — measured: reintroducing the bug fails 6 tests at UTC+7 and
          # **zero** at UTC. On a UTC runner the pipeline would have shipped it with
          # a green tick.
          #
          # Any date logic that reads a local hour or a local day has the same blind
          # spot, so the whole suite runs east of UTC rather than one file.
          TZ: Asia/Ho_Chi_Minh
          ${{ matrix.switch }}: 1
          # Mọi biến `<PREFIX>_*` mà suite đọc (kể cả HOST, dù mặc định đã là
          # 127.0.0.1) — tests/ci-integration-matrix.test.ts đọc mã của từng suite
          # và đỏ khi thiếu một biến ở đây.
          ANALYTICS_DDL_HOST: 127.0.0.1
          ANALYTICS_DDL_PORT: 3306
          ANALYTICS_DDL_USER: root
          ANALYTICS_DDL_PASSWORD: test_root_password
          CHATBOT_DDL_HOST: 127.0.0.1
          CHATBOT_DDL_PORT: 3306
          CHATBOT_DDL_USER: root
          CHATBOT_DDL_PASSWORD: test_root_password
          MFA_DDL_HOST: 127.0.0.1
          MFA_DDL_PORT: 3306
          MFA_DDL_USER: root
          MFA_DDL_PASSWORD: test_root_password
          VIEW_BOOST_HOST: 127.0.0.1
          VIEW_BOOST_PORT: 3306
          VIEW_BOOST_USER: root
          VIEW_BOOST_PASSWORD: test_root_password
          CHAT_RETENTION_HOST: 127.0.0.1
          CHAT_RETENTION_PORT: 3306
          CHAT_RETENTION_USER: root
          CHAT_RETENTION_PASSWORD: test_root_password
          READER_RETENTION_HOST: 127.0.0.1
          READER_RETENTION_PORT: 3306
          READER_RETENTION_USER: root
          READER_RETENTION_PASSWORD: test_root_password
          INSERT_ID_HOST: 127.0.0.1
          INSERT_ID_PORT: 3306
          INSERT_ID_USER: root
          INSERT_ID_PASSWORD: test_root_password
          NOTIFICATION_PAGE_HOST: 127.0.0.1
          NOTIFICATION_PAGE_PORT: 3306
          NOTIFICATION_PAGE_USER: root
          NOTIFICATION_PAGE_PASSWORD: test_root_password
          NOTIFICATION_EMAIL_HOST: 127.0.0.1
          NOTIFICATION_EMAIL_PORT: 3306
          NOTIFICATION_EMAIL_USER: root
          NOTIFICATION_EMAIL_PASSWORD: test_root_password
          SUBMISSION_WORKFLOW_HOST: 127.0.0.1
          SUBMISSION_WORKFLOW_PORT: 3306
          SUBMISSION_WORKFLOW_USER: root
          SUBMISSION_WORKFLOW_PASSWORD: test_root_password
          MEDIA_QUEUE_HOST: 127.0.0.1
          MEDIA_QUEUE_PORT: 3306
          MEDIA_QUEUE_USER: root
          MEDIA_QUEUE_PASSWORD: test_root_password
          MEDIA_UPLOAD_PORT: 3306
          MEDIA_UPLOAD_USER: root
          MEDIA_UPLOAD_PASSWORD: test_root_password
          LIVESTREAM_TOGGLE_HOST: 127.0.0.1
          LIVESTREAM_TOGGLE_PORT: 3306
          LIVESTREAM_TOGGLE_USER: root
          LIVESTREAM_TOGGLE_PASSWORD: test_root_password
          MEDIA_SELF_HEAL_HOST: 127.0.0.1
          MEDIA_SELF_HEAL_PORT: 3306
          MEDIA_SELF_HEAL_USER: root
          MEDIA_SELF_HEAL_PASSWORD: test_root_password
          BACKUP_DUMP_HOST: 127.0.0.1
          BACKUP_DUMP_PORT: 3306
          BACKUP_DUMP_USER: root
          BACKUP_DUMP_PASSWORD: test_root_password
          MEDIA_SYNC_HOST: 127.0.0.1
          MEDIA_SYNC_PORT: 3306
          MEDIA_SYNC_USER: root
          MEDIA_SYNC_PASSWORD: test_root_password
          PUBLIC_READ_HOST: 127.0.0.1
          PUBLIC_READ_PORT: 3306
          PUBLIC_READ_USER: root
          PUBLIC_READ_PASSWORD: test_root_password
          MEDIA_CATEGORY_MIGRATION_HOST: 127.0.0.1
          MEDIA_CATEGORY_MIGRATION_PORT: 3306
          MEDIA_CATEGORY_MIGRATION_USER: root
          MEDIA_CATEGORY_MIGRATION_PASSWORD: test_root_password
        # TAP được ghim (không để Node tự chọn theo TTY — Node 24 in `ℹ tests N` khi
        # không có TTY, bản cũ in `# Subtest:`), và `tee` giữ một bản cho bước kiểm
        # skip bên dưới. `pipefail` giữ mã thoát của node qua ống `tee`.
        run: |
          set -euo pipefail
          node --experimental-strip-types --experimental-test-module-mocks --import ./scripts/ts-resolver.mjs --test-reporter=tap --test ${{ matrix.file }} 2>&1 | tee "$RUNNER_TEMP/${{ matrix.suite }}.log"

      # A suite that silently stops running is worse than one that fails: the run
      # stays green. Integration tests self-skip when their switch is absent, so
      # the switch being wired is the only thing that separates "ran" from "was
      # quietly ignored". Mỗi job matrix chỉ bật đúng switch của mình — nếu
      # matrix.include quên ánh xạ một suite sang switch, suite đó sẽ SKIP mà
      # job vẫn xanh. Step này canh đúng điều đó; việc đối chiếu matrix ↔ tệp ↔
      # biến môi trường nằm ở tests/ci-integration-matrix.test.ts (job unit-tests).
      #
      # Đọc bản log bước trên đã ghi, KHÔNG chạy lại suite: chạy lại từng làm job
      # kéo dài gấp đôi, và một lần chạy lại thiếu biến môi trường đã treo cả job
      # tới khi `timeout-minutes` cắt (`Integration · notification-email`).
      - name: Fail if this suite skipped
        timeout-minutes: 3
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/${{ matrix.suite }}.log"
          if [ ! -s "$log" ]; then
            echo "::error::không có log của bước Integration ($log) — không xác nhận được suite đã chạy"
            exit 1
          fi
          # Dòng tổng kết TAP (`# tests N`, `# pass N`, `# skipped N`); lấy dòng CUỐI
          # của mỗi loại. awk đọc hết tệp — không `head`/`grep -q` trong ống dưới pipefail.
          summary() { awk -v key="$1" '$1 == "#" && $2 == key && $3 ~ /^[0-9]+$/ { n = $3 } END { print n + 0 }' "$log"; }
          tests_total=$(summary tests)
          tests_pass=$(summary pass)
          tests_skipped=$(summary skipped)
          echo "Suite ${{ matrix.suite }}: tests=$tests_total pass=$tests_pass skipped=$tests_skipped"
          if [ "$tests_total" -eq 0 ] || [ "$tests_pass" -eq 0 ] || [ "$tests_skipped" -ge "$tests_total" ]; then
            echo "::error::Suite ${{ matrix.suite }} ran zero subtests (tests=$tests_total pass=$tests_pass skipped=$tests_skipped) — the switch ${{ matrix.switch }} is not wired in matrix.include, or the suite silently skipped."
            exit 1
          fi

  # ── Schema drift (cần MySQL) ───────────────────────────────────────────────
  # schema.ts và init.ts là hai mô tả tay của cùng một tập bảng. Chúng lệch nhau
  # âm thầm; đây là thứ duy nhất nhận ra. Tách riêng để nó chạy song song với
  # integration-tests, và nếu unit-tests/typecheck kéo dài thì schema-drift vẫn
  # kết thúc đúng giờ (nó chạy trong < 2 phút).
  schema-drift:
    name: Schema drift
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: cdkt_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # schema.ts and init.ts are two hand-maintained descriptions of the same
      # set of tables. They drift silently; this is the only thing that notices.
      # (Deliberately not quoting a table count here — it went stale twice.)
      - name: Schema drift
        run: npm run db:drift

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 35
    # The browser suite runs in this job rather than its own because it needs the
    # bundle this job just produced. A separate job would either rebuild (another
    # five minutes) or pass .output between jobs as an artifact.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      # FFmpeg qua apt — có trần thời gian, và đổi sang mirror chính của Ubuntu khi mirror
      # mặc định chậm/hỏng. Từ 2026-10-23 mirror azure.archive.ubuntu.com cấu hình sẵn trên
      # runner làm bước này mất tới 20 phút (trước đó 20–60 giây) và cắt job vì quá timeout
      # dù build/test đều xanh. Runner ubuntu-24.04 khai `URIs: mirror+file:/etc/apt/apt-mirrors.txt`
      # nên tên mirror nằm trong apt-mirrors.txt — sửa sources.list mà thôi thì không đổi gì.
      # Chỉ bước TẢI có trần thời gian; giải nén/cài từ gói đã tải chạy sau, không bị cắt giữa
      # chừng (dpkg bị giết giữa chừng làm mọi lần thử sau hỏng ngay). `--no-install-recommends`:
      # libx264, aac, lavfi, ffprobe đều là phụ thuộc bắt buộc của gói ffmpeg.
      - name: Install FFmpeg
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for mirror in default archive.ubuntu.com; do
            if [ "$mirror" != default ]; then
              echo "::warning::mirror apt mặc định chậm hoặc hỏng — chuyển sang archive.ubuntu.com"
              sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
              cat /etc/apt/apt-mirrors.txt 2>/dev/null || true
            fi
            if timeout -k 10 90 sudo -E apt-get $APT_OPTS update -qq \
              && timeout -k 10 180 sudo -E apt-get $APT_OPTS install -y -qq --download-only --no-install-recommends ffmpeg; then
              sudo -E apt-get install -y -qq --no-install-recommends ffmpeg
              ffmpeg -hide_banner -version | head -1
              exit 0
            fi
          done
          exit 1


      - name: Build
        run: npm run build

      # Proves the bundle compiles, which used to be discovered on the VPS.

      - name: Fail if the bundle did not appear
        run: test -d .output/server && test -d .output/public

      # Chromium only — see playwright.config.ts. Each additional browser is
      # another ~100 MB download and answers nothing these specs ask.
      # `playwright install --with-deps` chạy apt riêng của nó trên cùng mirror — có trần thời
      # gian để một mirror chậm không ăn hết timeout của job (bước FFmpeg phía trên chỉ
      # chuyển mirror khi lần tải đầu hỏng/quá hạn).
      - name: Install Chromium
        timeout-minutes: 8
        run: npm run test:e2e:install

      # What no source-text test can reach: the retry button actually re-issuing
      # the failed request, in a browser, without reloading the document.
      # tests/e2e/global-setup.ts creates its own single-use database and drops
      # it again, so it cannot collide with the suites in the test job.
      - name: Browser tests
        env:
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: 3306
          E2E_DB_USER: root
          E2E_DB_PASSWORD: test_root_password
          MEDIA_UPLOAD_ENABLED: 'true'
          NUXT_MEDIA_UPLOAD_ENABLED: 'true'
        run: npm run test:e2e
      # Traces and screenshots are written only for failures, so this uploads
      # nothing on a green run. Without it a CI-only failure is a one-line
      # assertion message with no way to see what the page actually showed.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  hygiene:
    name: Secrets and defaults
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The admin password hash reached this repository once already, inside a
      # committed SQL dump. This is the cheap guard against a repeat.
      - name: No .env file committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked in git"
            exit 1
          fi

      - name: No private keys or credential blobs added
        run: |
          if git grep -nIE 'BEGIN (RSA|OPENSSH|DSA|EC|PGP) PRIVATE KEY' -- . ':!*.md'; then
            echo "::error::a private key is committed"
            exit 1
          fi

      - name: No known-default secrets in tracked files
        run: |
          # These exact strings shipped as defaults at some point in this
          # repository's history. None of them may come back. The bracketed
          # last character keeps this pattern line from matching itself, so
          # the workflow file stays covered by its own scan.
          patterns='cdkt_admin_secret_change_m[e]|cdkt_docker_jwt_secret_98765432[1]|cdkt_secret_key_change_me_12345[6]'
          if git grep -nIE "$patterns" -- . ':!server/plugins/require-secrets.ts' ':!tests/*' ':!*.md'; then
            echo "::error::a known-default secret is present outside the guard that rejects it"
            exit 1
          fi

      - name: Shell scripts parse
        run: |
          for script in scripts/*.sh; do
            bash -n "$script" || exit 1
          done

      - name: No accidental UTC date usage outside analytics
        run: |
          # scheduler/retention must use localDay, not getUTC*/utcDay — UTC bug skips nightly pass at UTC+7.
          # analytics/* intentionally uses UTC (events stored in UTC).
          # server/utils/utc-query.ts is the analytics UTC query adapter (formats Date params
          # as UTC for the analytics tables) — exempt by exact path, anchored so a file of the
          # same name elsewhere is still checked.
          offenders=$(grep -rn "getUTC\|utcDay" --include="*.ts" server/services/ server/utils/ server/plugins/ server/db/ 2>/dev/null | grep -v "analytics" | grep -v "^server/utils/utc-query\.ts:" | grep -v "node_modules" || true)
          if [ -n "$offenders" ]; then
            echo "::error::UTC date API outside analytics/: $offenders"
            echo "$offenders"
            exit 1
          fi

      # Không có cổng này, bốn lỗ hổng mức trung bình đã nằm im trong cây phụ
      # thuộc mà không có gì nói ra — phát hiện được chỉ vì có người chạy tay.
      #
      # `--omit=dev` là phần quyết định cổng này còn được tôn trọng hay không.
      # Toàn cây có 830 gói, phần lớn là công cụ dev không bao giờ ra production
      # (`Dockerfile` stage runtime chạy `npm ci --omit=dev`), nên một cổng chặn
      # theo cả cây sẽ đỏ vì `esbuild serve` — một dev server dự án này không
      # chạy ở đâu cả. Cổng đỏ vì thứ không thể xảy ra sẽ bị tắt đi, và lúc đó
      # nó cũng không còn chặn thứ có thể xảy ra.
      #
      # `--audit-level=high` cùng lý do: `moderate` gồm nhiều advisory chỉ áp
      # dụng cho môi trường phát triển.
      #
      # Không cần `npm ci` — `npm audit` chỉ đọc `package.json` + lockfile (đã
      # kiểm trong một thư mục chỉ có hai tệp đó), nên job này vẫn không phải
      # cài gì.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # BLOCKING: `dependencies` chỉ còn gói runtime (nuxt/vue/tailwind… là
      # build-time → devDependencies; `.output` tự chứa), nên tập này đạt 0
      # advisory và một advisory high/critical mới ở đây là thật sự đáng đỏ.
      - name: No known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Không chặn, chỉ ghi lại. Lỗ hổng ở gói dev là thông tin đáng thấy trong
      # log, nhưng nó không phải lý do để chặn một lượt deploy — xem lý do
      # `--omit=dev` ở trên. `|| true` là chủ đích, không phải sót.
      - name: Report dev-dependency advisories (non-blocking)
        run: npm audit || true

      # Third-party action, so pinned to a commit rather than a moving ref:
      # @master would run whatever that branch holds at the time of the build.
      # The trailing comment is the human-readable version of that SHA.
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./scripts
          severity: warning

  # ── Triển khai ──────────────────────────────────────────────────────────────
  # Hai job dưới đây chỉ chạy trên `main`, và chỉ SAU khi cả năm cổng trên đã
  # xanh. Chúng nằm trong cùng một workflow (thay vì `workflow_run` riêng) để
  # điều đó là một ràng buộc của đồ thị phụ thuộc chứ không phải một lời hứa:
  # không có commit nào đi ra VPS mà chưa qua unit-tests, integration-tests,
  # schema-drift, build và hygiene.

  image:
    name: Build and push image
    # `changes` có mặt để đọc output `deploy`: push chỉ đổi tài liệu (*.md, docs/,
    # openspec/) thì không build image, nên cũng không deploy (job `changes`).
    needs: [changes, unit-tests, integration-tests, schema-drift, build, hygiene]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Chỉ job này được ghi vào registry; ba job kia vẫn chỉ đọc mã nguồn.
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token của chính lượt chạy, sống đúng bằng job. Không có PAT nào phải
          # tạo, phải xoay, hay phải nhớ đã cấp cho ai.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image reference
        id: meta
        run: |
          # Tên chủ sở hữu trên GHCR phải viết thường; tên đăng nhập GitHub thì
          # không bắt buộc, nên hạ chữ ở đây thay vì trông chờ vào may mắn.
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "repo=ghcr.io/$repo"
            # Ghim theo SHA đầy đủ: `latest` là thứ có thể trỏ đi chỗ khác giữa
            # lúc job image kết thúc và job deploy bắt đầu. Muốn lùi phiên bản
            # thì đây cũng chính là tag để trỏ lại.
            echo "image=ghcr.io/$repo:sha-${{ github.sha }}"
            # SHA ngắn nướng vào image (APP_VERSION) — /api/public/health trả lại
            # nó, và bước smoke của job deploy so đúng chuỗi này.
            echo "version=${GITHUB_SHA::12}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest
          # Lớp cuối của Dockerfile (ARG/ENV ngay trước CMD): đổi mỗi commit mà
          # không làm mất bộ nhớ đệm của lớp nào phía trên.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          # Một lượt push = MỘT version trên GHCR. Với attestation provenance mặc
          # định, image là một index kèm hai manifest con KHÔNG thẻ; GHCR đếm mỗi
          # cái là một version, nên `min-versions-to-keep` của ghcr-retention.yml
          # đếm sai, và xoá version cũ nhất có thể xoá manifest con của một image
          # còn giữ — image đó hết kéo được. Không bên nào trong luồng này đọc
          # provenance.
          provenance: false
          # Bộ nhớ đệm tầng của Actions: `npm ci` và `nuxi build` là phần đắt
          # nhất, và giữa hai lần push chúng gần như không đổi.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Dockerfile mount bí mật `admin_password` với required=false, và CI cố
          # ý KHÔNG cung cấp: seed là insert-only nên tài khoản quản trị trên
          # deployment đang chạy đã tồn tại từ lâu, và một mật khẩu quản trị
          # không có lý do gì phải đi qua CI. Guard báo "absent" rồi cho qua.

  deploy:
    name: Deploy to VPS
    needs: image
    # Auto-deploy: push main build + test + push image lên GHCR, RỒI tự SSH deploy
    # lên VPS — mỗi khi job `image` thành công. `image` bị bỏ qua (push chỉ đổi tài
    # liệu, PR) thì deploy cũng bỏ qua. Muốn tắt hẳn: `if: false`.
    if: needs.image.result == 'success'
    runs-on: ubuntu-latest
    # Một job bị cắt vì quá giờ là cắt phiên SSH giữa chừng — đường lùi không chạy.
    # Trần tính đủ: dump CSDL trước deploy (lớn dần theo dữ liệu), kéo image, chờ
    # healthy tối đa 300 s, có thể thêm một lượt lùi cũng 300 s, rồi smoke (~2 phút khi
    # trang trả lời ngay, tệ nhất ~4 phút).
    timeout-minutes: 30
    # Nhóm riêng, KHÔNG huỷ: hai lượt deploy không bao giờ chạy chồng lên nhau,
    # lượt sau chờ lượt trước xong. Nhưng nhóm này KHÔNG tự bảo vệ được lượt
    # deploy đang chạy khỏi việc huỷ ở cấp workflow (nhóm `ci-…` ở đầu tệp): huỷ
    # một lượt chạy là huỷ mọi job trong nó, bất kể nhóm riêng của job. Thứ thật
    # sự giữ cho deploy không bị cắt giữa chừng là `cancel-in-progress` ở đầu tệp
    # chỉ bật cho pull request — cắt ngang một lượt deploy sẽ để lại .env đã trỏ
    # sang image mới trong khi chưa ai xác nhận nó khoẻ, và đường lùi không chạy.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.VPS_PORT || '22' }}
          APP_DIR: ${{ vars.VPS_APP_DIR }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          set -euo pipefail
          for required in SSH_KEY SSH_HOST SSH_USER SSH_KNOWN_HOSTS APP_DIR; do
            if [ -z "${!required}" ]; then
              echo "::error::thiếu $required — xem mục CI/CD trong DEPLOY.md"
              exit 1
            fi
          done

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Khoá máy chủ được ghim sẵn thay vì `ssh-keyscan` lúc chạy: keyscan là
          # tin-lần-đầu ở MỌI lần chạy, tức là không bảo vệ gì trước một bên xen
          # giữa — mà bên đó sẽ nhận được cả phiên deploy.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Keep-alive: dump CSDL và chờ healthcheck có thể im lặng nhiều phút; NAT/tường
          # lửa cắt phiên TCP "rảnh" là cắt lượt deploy giữa chừng, trước cả đường lùi.
          # Hỏi mỗi 30 s, bỏ cuộc sau 10 lần không trả lời (5 phút).
          ssh_opts=(
            -i ~/.ssh/deploy_key
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=~/.ssh/known_hosts
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
            -p "$SSH_PORT"
          )

          # docker-compose.yml của CHÍNH commit này đi cùng image của nó. Trước
          # đây VPS dùng bản compose nằm sẵn ở đó từ lần `git pull` cuối cùng ai
          # đó nhớ chạy: compose chỉ chuyển vào container những biến nó liệt kê,
          # nên một biến mới thêm vào compose không bao giờ tới được production,
          # và một image cần cấu hình mới chạy trên cấu hình cũ. Gửi tệp sang một
          # tên tạm; script trên VPS kiểm SHA-256 (một phiên SSH đứt giữa chừng
          # để lại tệp cụt mà vẫn có thể là YAML hợp lệ), sao lưu bản cũ, chạy
          # `docker compose config -q`, rồi mới dùng. Sai ở bất kỳ bước nào thì
          # dừng mà không chạm container đang chạy.
          compose_sha256=$(sha256sum docker-compose.yml | cut -d' ' -f1)
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" \
              "cat > '$APP_DIR/.docker-compose.incoming.yml'" < docker-compose.yml

          # scripts/backup-db.sh của CHÍNH commit này, cho bản dump CSDL trước khi
          # đổi image (deploy-remote.sh `predeploy_dump`). Bản trong bản clone git
          # trên VPS chỉ mới khi có người `git pull` — một bản cũ hiểu `--prefix` là
          # thư mục đích. Vào .deploy-incoming/ (một cấp dưới APP_DIR) để script tự
          # tìm đúng .env; cùng phép kiểm SHA-256 như compose.
          backup_sha256=$(sha256sum scripts/backup-db.sh | cut -d' ' -f1)
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" \
              "mkdir -p '$APP_DIR/.deploy-incoming' && cat > '$APP_DIR/.deploy-incoming/backup-db.sh'" < scripts/backup-db.sh

          # Nạp script qua stdin: VPS chạy đúng bản của commit đang được triển
          # khai, không phải bản nằm sẵn trên máy chủ từ lần deploy nào đó trước.
          # `env` thay vì `VAR=… bash`: không phụ thuộc shell đăng nhập của VPS_USER.
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" \
              "env INCOMING_COMPOSE=.docker-compose.incoming.yml INCOMING_COMPOSE_SHA256=$compose_sha256 INCOMING_BACKUP_SCRIPT=.deploy-incoming/backup-db.sh INCOMING_BACKUP_SCRIPT_SHA256=$backup_sha256 bash -s -- '$APP_DIR' '$IMAGE'" \
              < scripts/deploy-remote.sh

      # "healthy" trên VPS chỉ nói container trả lời được ở 127.0.0.1. Bước này hỏi
      # QUA ĐỊA CHỈ CÔNG KHAI (nginx, CDN, DNS) và chỉ coi là thành công khi trả 200
      # với đúng SHA vừa deploy — một 200 của container cũ hay của bộ đệm không tính.
      # Hỏng thì job đỏ nhưng KHÔNG tự lùi: nguyên nhân có thể là CDN/DNS chứ không
      # phải image, và lùi một container đang khoẻ vì CDN chậm là sai. Cách lùi tay:
      # mục Report bên dưới + CI-CD.md § Lùi phiên bản.
      - name: Smoke test through the public URL
        env:
          SMOKE_URL: ${{ vars.VPS_SMOKE_URL }}
          EXPECTED_VERSION: ${{ needs.image.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$SMOKE_URL" ]; then
            echo "::warning::chưa đặt biến repo VPS_SMOKE_URL (vd. https://<tên miền>) — bỏ qua smoke test qua địa chỉ công khai; lượt deploy chỉ được xác nhận bằng healthcheck trong container"
            exit 0
          fi
          url="${SMOKE_URL%/}/api/public/health"
          seen=''
          # 12 lần, nghỉ 10 s GIỮA hai lần (không nghỉ sau lần cuối): ~2 phút khi mỗi lần
          # trả lời ngay; tệ nhất ~3 phút 50 giây (12 × trần 10 s của curl + 11 × 10 s nghỉ).
          # `-L`: trang trả lời qua chuyển hướng (http→https, tên miền gốc→www) vẫn tính.
          for attempt in $(seq 1 12); do
            # `?t=` khác nhau mỗi lần: không lớp đệm nào trả lại câu trả lời cũ.
            if body=$(curl -fsSL -m 10 "$url?t=${GITHUB_RUN_ID}-${attempt}" 2>&1); then
              seen=$(printf '%s' "$body" | jq -r '.version // empty' 2>/dev/null || true)
              if [ "$seen" = "$EXPECTED_VERSION" ]; then
                echo "✅ $url trả 200 với version $seen (lần $attempt)"
                exit 0
              fi
              echo "  lần $attempt: đang phục vụ version '${seen:-?}', chờ $EXPECTED_VERSION"
            else
              echo "  lần $attempt: $body"
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 10
            fi
          done
          echo "::error::sau 12 lần thử (nghỉ 10 s giữa hai lần, mỗi lần chờ tối đa 10 s) $url vẫn không trả 200 với version $EXPECTED_VERSION (lần cuối thấy: '${seen:-không có}'). Container trên VPS đã healthy — kiểm nginx/CDN/DNS trước; cần lùi thì xem mục Deploy trong Summary của lượt chạy này và CI-CD.md § Lùi phiên bản."
          exit 1

      - name: Report
        if: always()
        run: |
          {
            echo "### Deploy"
            echo
            echo "- Image: \`${{ needs.image.outputs.image }}\` (version \`${{ needs.image.outputs.version }}\`)"
            echo "- Kết quả: ${{ job.status }}"
            echo "- Bản dump CSDL trước lượt này: \`<VPS_APP_DIR>/.deploy-db-backups/cdkt-predeploy-<db>-<thời-điểm>-<pid>.sql.gz\` (giữ 5 bản mới nhất)"
            echo
            echo "Lùi phiên bản thủ công trên VPS (compose cũ nằm ở .deploy-compose-backups/ nếu lượt này đã đổi nó):"
            echo '```bash'
            echo "cd <VPS_APP_DIR>"
            echo "cp -p .deploy-compose-backups/docker-compose.<thời-điểm>.yml docker-compose.yml   # chỉ khi compose đã đổi"
            echo "sed -i 's|^CDKT_IMAGE=.*|CDKT_IMAGE=<image-cũ>|' .env"
            echo "docker compose up -d --no-deps app"
            echo '```'
            echo "Dữ liệu hỏng vì image mới (migration) thì khôi phục bản dump trước lượt này — DEPLOY.md § Khôi phục thật (\`scripts/restore-db.sh\`)."
          } >> "$GITHUB_STEP_SUMMARY"
