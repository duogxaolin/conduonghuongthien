services:
  mysql:
    build:
      context: ./docker
      dockerfile: Dockerfile.mysql
    container_name: cdkt_mysql
    restart: always
    environment:
      # Required — no defaults. Set these in the .env file next to docker-compose.yml.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cdkt_admin}
      MYSQL_USER: ${MYSQL_USER:-cdkt_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      # "strict" = full ACID (innodb_flush_log_at_trx_commit=1).
      # Default trades up to ~1s of commits on a HOST crash for throughput.
      MYSQL_DURABILITY: ${MYSQL_DURABILITY:-fast}
    ports:
      # Loopback-only: the database must not be reachable from the network.
      - "127.0.0.1:${MYSQL_EXTERNAL_PORT:-33069}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Authenticated ping: an unauthenticated ping answers "alive" while the
      # server is still initialising, which let the app start too early.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    # MySQL needs time to flush and close cleanly; the 10s default can corrupt
    # a busy InnoDB shutdown.
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          # Autotune reads this limit (cgroup) rather than host RAM.
          memory: ${MYSQL_MEM_LIMIT:-1g}

  app:
    # CI xây image rồi đẩy lên GHCR; VPS chỉ kéo về. `docker compose pull` không
    # làm gì được với service chỉ khai `build:`, nên tên image là bắt buộc.
    # Mặc định `cdkt/app:local` giữ nguyên luồng cũ cho máy phát triển: không
    # đặt CDKT_IMAGE thì `docker compose build` vẫn tự xây và tự gắn tên đó.
    #
    # Vì sao build ở CI chứ không `git pull && build` trên VPS: `nuxi build` ngốn
    # RAM, và trên VPS 1-2GB nó bị OOM-kill giữa chừng — đúng lúc container cũ đã
    # dừng. Build ở nơi khác thì một lần build hỏng không chạm được vào trang
    # đang chạy, và lùi phiên bản chỉ là trỏ lại tag cũ thay vì xây lại từ đầu.
    image: ${CDKT_IMAGE:-cdkt/app:local}
    build:
      context: .
      # The build stage checks ADMIN_PASSWORD against the password policy before
      # spending minutes on `nuxi build`. It arrives as a BuildKit secret, not a
      # build arg: a build arg is recorded in `docker history` forever.
      # Mounted with required=false, so a build with no ADMIN_PASSWORD set still
      # works — the check simply reports "absent" and lets the build through.
      secrets:
        - admin_password
    container_name: cdkt_app
    restart: always
    ports:
      # Loopback only, matching the mysql service above. Published on 0.0.0.0 this
      # answered plain HTTP on :3000 from the internet, which bypasses whatever
      # TLS the reverse proxy terminates — the certificate is not optional if the
      # port it protects is also reachable without it. Put nginx in front and
      # proxy to 127.0.0.1:3000. To run with no proxy at all, override with
      # APP_BIND=0.0.0.0 and terminate TLS somewhere else.
      - "${APP_BIND:-127.0.0.1}:${PORT:-3000}:${PORT:-3000}"
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      # Defaults to root for backwards compatibility. To run with least
      # privilege set DB_USER=cdkt_user and DB_PASSWORD=<MYSQL_PASSWORD>.
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_ROOT_PASSWORD}}
      DB_NAME: ${MYSQL_DATABASE:-cdkt_admin}
      # ── Secrets: REQUIRED, no defaults (a committed default is forgeable). ──
      #   JWT_SECRET / ANALYTICS_HMAC_SECRET : openssl rand -hex 32
      #   CHATBOT_ENCRYPTION_SECRET          : openssl rand -base64 32
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - generate with openssl rand -hex 32}
      CHATBOT_ENCRYPTION_SECRET: ${CHATBOT_ENCRYPTION_SECRET:?CHATBOT_ENCRYPTION_SECRET is required - generate with openssl rand -base64 32}
      # The build-time value is only a placeholder: Nitro reads the NUXT_-prefixed
      # name at runtime, so BOTH must be supplied for the real secret to apply.
      ANALYTICS_HMAC_SECRET: ${ANALYTICS_HMAC_SECRET:?ANALYTICS_HMAC_SECRET is required - generate with openssl rand -hex 32}
      NUXT_ANALYTICS_HMAC_SECRET: ${ANALYTICS_HMAC_SECRET}
      ANALYTICS_COLLECTION_ENABLED: ${ANALYTICS_COLLECTION_ENABLED:-true}
      NUXT_ANALYTICS_COLLECTION_ENABLED: ${NUXT_ANALYTICS_COLLECTION_ENABLED:-true}
      # Behind a proxy the peer address is the docker bridge gateway for every
      # visitor, so per-IP rate limits collapse into one shared bucket and audit
      # rows record the proxy. Naming the proxy here restores the real address
      # without trusting a header from an unknown sender. Both names are needed:
      # Nitro reads the NUXT_-prefixed one at runtime.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      NUXT_TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      # Public address of the portal, used to build the Google OAuth redirect URI
      # that Google matches byte for byte. Same two-name treatment as the proxy
      # list above and for the same reason: Nitro reads the NUXT_-prefixed one at
      # runtime, the bare name is for maintenance scripts running outside Nitro.
      # Not required to boot — empty falls back to the request host and the
      # settings page says so out loud.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      NUXT_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Cửa sổ lưu dữ liệu cá nhân. Cả bốn khai ở đây vì compose KHÔNG dùng
      # env_file: một biến đặt trong .env mà không được liệt kê thì không tới được
      # container, nên người vận hành sẽ sửa tệp rồi không thấy gì thay đổi.
      # Tất cả chỉ là GIÁ TRỊ KHỞI ĐIỂM — khi quản trị viên lưu cấu hình tại
      # /admin/settings/data-retention thì giá trị trong CSDL thắng, và trang đó
      # nói rõ từng ô đang lấy từ đâu.
      ACTIVITY_LOG_RETENTION_DAYS: ${ACTIVITY_LOG_RETENTION_DAYS:-}
      SUBMISSION_RETENTION_DAYS: ${SUBMISSION_RETENTION_DAYS:-}
      CHAT_SESSION_RETENTION_DAYS: ${CHAT_SESSION_RETENTION_DAYS:-}
      # Tài khoản người đọc — scope thứ tư. Tính tuổi theo last_seen_at, không
      # theo created_at: xoá một tài khoản là xoá luôn bình luận công khai của họ.
      READER_ACCOUNT_RETENTION_DAYS: ${READER_ACCOUNT_RETENTION_DAYS:-}
      # Used ONLY when the superadmin account is first created (seed is insert-only).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          memory: ${APP_MEM_LIMIT:-1g}

volumes:
  mysql_data:
  uploads_data:

secrets:
  # Sourced from the environment (i.e. the .env next to this file), so the value
  # never lands in the build context or an image layer. Compose tolerates it
  # being unset; the Dockerfile mounts it with required=false to match.
  admin_password:
    environment: ADMIN_PASSWORD
