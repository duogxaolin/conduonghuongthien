services:
  mysql:
    image: mysql:8.0
    container_name: cdkt_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cdkt_admin
      MYSQL_USER: cdkt_user
      MYSQL_PASSWORD: cdkt_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: cdkt_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: cdkt_admin
      JWT_SECRET: cdkt_docker_jwt_secret_987654321
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
